<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#020617" />
    <title>Koneksi terputas — ZAYTRIX</title>
    <style>
      /* Dokumen offline MANDIRI (QA10-D): tanpa dependensi eksternal —
         CSS inline penuh; ikon /icons/icon-192.png adalah aset precache SW. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617; /* slate-950 — sama dengan tema app */
        color: #d4d4d8;      /* zinc-300 */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        text-align: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 26rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { color: #f4f4f5; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; }
      p { color: #71717a; } /* zinc-500 */
      button {
        margin-top: 0.5rem;
        min-height: 44px; /* target sentuh ramah mobile */
        padding: 0.75rem 1.75rem;
        border: 1px solid #3f3f46;
        border-radius: 0.75rem;
        background: #18181b;
        color: #e4e4e7;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease;
      }
      button:hover { background: #27272a; border-color: #52525b; }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #020617, 0 0 0 4px #a1a1aa;
      }
      .status { font-size: 0.75rem; color: #52525b; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Logo ZAYTRIX" width="64" height="64" />
      <h1>Koneksi terputus</h1>
      <p>
        ZAYTRIX membutuhkan koneksi internet untuk data pasar real-time —
        harga, whale radar, dan analisis AI tidak pernah disajikan dari cache
        basi demi integritas data. Halaman akan dimuat ulang otomatis begitu
        koneksi kembali.
      </p>
      <button type="button" id="retry">Coba lagi</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      // QA10-D (PWA): script kecil — muat ulang otomatis saat browser
      // mendeteksi jaringan kembali online.
      window.addEventListener("online", function () {
        window.location.reload();
      });
      // Tombol "Coba lagi": reload penuh (memicu jalur network-first SW).
      document.getElementById("retry").addEventListener("click", function () {
        document.getElementById("status").textContent = "Memeriksa koneksi…";
        window.location.reload();
      });
    </script>
  </body>
</html>
